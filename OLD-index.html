<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Color Palette - Change these to customize */
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            /* Subtle gradient background */
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        /* Time and Greeting */
        .time-section {
            margin-bottom: 40px;
        }

        #clock {
            font-size: 5rem;
            font-weight: 600;
            letter-spacing: -2px;
            color: var(--text-main);
        }

        #greeting {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-top: -10px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 50px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar:focus {
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .link-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .link-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
            border-color: rgba(255,255,255,0.2);
        }

        .link-card i {
            font-size: 1.8rem;
            color: var(--accent);
        }

        .link-card span {
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            #clock { font-size: 3.5rem; }
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="time-section">
            <div id="clock">00:00</div>
            <div id="greeting">Hello</div>
        </div>

        <form action="https://www.google.com/search" method="GET" class="search-container">
            <input type="text" name="q" class="search-bar" placeholder="Search the web..." autocomplete="off" autofocus>
        </form>

        <div class="links-grid">
            
            <a href="https://youtube.com" class="link-card">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <a href="https://reddit.com" class="link-card">
                <i class="fa-brands fa-reddit-alien"></i>
                <span>Reddit</span>
            </a>

            <a href="https://github.com" class="link-card">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>

            <a href="https://mail.google.com" class="link-card">
                <i class="fa-solid fa-envelope"></i>
                <span>Gmail</span>
            </a>

            <a href="https://chatgpt.com" class="link-card">
                <i class="fa-solid fa-robot"></i>
                <span>ChatGPT</span>
            </a>

            <a href="https://netflix.com" class="link-card">
                <i class="fa-solid fa-play"></i>
                <span>Netflix</span>
            </a>

        </div>
    </div>

    <script>
        // Clock Functionality
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            // Dynamic Greeting
            const hour = now.getHours();
            const greetingElement = document.getElementById('greeting');
            if (hour < 12) greetingElement.textContent = "Good morning";
            else if (hour < 18) greetingElement.textContent = "Good afternoon";
            else greetingElement.textContent = "Good evening";
        }

        setInterval(updateClock, 1000);
        updateClock(); // Run immediately on load
    </script>

</body>
</html>
